<svg xmlns="http://www.w3.org/2000/svg" width="900" height="6" viewBox="0 0 900 6" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00C6FF"><animate attributeName="stop-color" values="#00C6FF;#6A5ACD;#00C6FF" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#0072FF"><animate attributeName="stop-color" values="#0072FF;#00C6FF;#0072FF" dur="4s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <clipPath id="c"><rect y="1.5" width="900" height="3" rx="1.5"/></clipPath>
  </defs>
  <rect y="1.5" width="900" height="3" rx="1.5" fill="url(#g)" opacity=".85"/>
  <g clip-path="url(#c)">
    <rect y="0" width="140" height="6" fill="#ffffff" opacity=".7">
      <animate attributeName="x" from="-140" to="900" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>