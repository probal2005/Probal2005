name: Update Profile README

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate latest projects
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          script: |
            const fs = require("fs");

            const username = "probal2005";

            const repositories = await github.paginate(
              github.rest.repos.listForUser,
              {
                username: username,
                type: "owner",
                sort: "updated",
                direction: "desc",
                per_page: 100
              }
            );

            const excludedRepositories = new Set([
              "probal2005"
            ]);

            const projects = repositories
              .filter(repo =>
                !repo.fork &&
                !repo.archived &&
                !excludedRepositories.has(repo.name)
              )
              .slice(0, 6);

            let projectTable = "";

            projectTable += "| Project | Description | Language | Stars |";
            projectTable += "\n";
            projectTable += "|---|---|---|---:|";
            projectTable += "\n";

            for (const repo of projects) {

              const name = repo.name;

              const description =
                repo.description ||
                "No description provided.";

              const cleanDescription =
                description
                  .replace(/\|/g, "\\|")
                  .replace(/\r?\n/g, " ")
                  .substring(0, 120);

              const language =
                repo.language || "—";

              const stars =
                repo.stargazers_count;

              projectTable +=
                `| [${name}](${repo.html_url}) | ` +
                `${cleanDescription} | ` +
                `${language} | ` +
                `${stars} |\n`;
            }

            const readmePath = "README.md";

            let readme =
              fs.readFileSync(readmePath, "utf8");

            const startMarker =
              "<!-- PROJECTS:START -->";

            const endMarker =
              "<!-- PROJECTS:END -->";

            const start =
              readme.indexOf(startMarker);

            const end =
              readme.indexOf(endMarker);

            if (start === -1 || end === -1) {
              core.setFailed(
                "README project markers not found."
              );

              return;
            }

            const before =
              readme.substring(
                0,
                start + startMarker.length
              );

            const after =
              readme.substring(end);

            const updatedReadme =
              before +
              "\n\n" +
              projectTable +
              "\n" +
              after;

            fs.writeFileSync(
              readmePath,
              updatedReadme
            );

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: update latest projects"
            git push
          fi
