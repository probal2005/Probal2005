name: Update Profile README

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Update latest repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          username = "probal2005"

          url = (
              f"https://api.github.com/users/{username}/repos"
              "?per_page=100&sort=updated&direction=desc"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "profile-readme-updater"
              }
          )

          token = os.environ.get("GH_TOKEN")

          if token:
              request.add_header(
                  "Authorization",
                  f"Bearer {token}"
              )

          with urllib.request.urlopen(request) as response:
              repos = json.load(response)

          repos = [
              repo for repo in repos
              if not repo["fork"]
              and not repo["archived"]
              and repo["name"].lower() != username.lower()
          ]

          repos = repos[:6]

          rows = [
              "| Project | Description | Language | ⭐ |",
              "|---|---|---|---:|"
          ]

          for repo in repos:

              name = repo["name"]

              description = (
                  repo["description"]
                  or "GitHub project"
              )

              description = (
                  description
                  .replace("|", "\\|")
                  .replace("\n", " ")
                  .strip()
              )

              if len(description) > 100:
                  description = description[:97] + "..."

              language = repo["language"] or "—"

              stars = repo["stargazers_count"]

              rows.append(
                  f"| [{name}]({repo['html_url']}) | "
                  f"{description} | "
                  f"{language} | "
                  f"{stars} |"
              )

          project_table = "\n".join(rows)

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          start_marker = "<!-- PROJECTS:START -->"
          end_marker = "<!-- PROJECTS:END -->"

          start = readme.find(start_marker)
          end = readme.find(end_marker)

          if start == -1 or end == -1:
              raise SystemExit(
                  "Project markers not found."
              )

          start_content = start + len(start_marker)

          new_readme = (
              readme[:start_content]
              + "\n\n"
              + project_table
              + "\n\n"
              + readme[end:]
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_readme)

          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update latest projects"
            git push
          fi
